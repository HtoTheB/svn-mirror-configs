name: Automatically keep selected SVN mirror repos up to date, using the SVN-replicator tool

on:
  schedule:
    # Runs once a day at 06:00 UTC. Scheduled runs always push (see the push
    # steps below); manual runs only push when the box is ticked.
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Defines the input fields for manual execution
    inputs:
      do_push:
        description: 'Push changes to the target repository (Overwrite remote)'
        required: true
        type: boolean
        default: false # Manual runs default to no push for safe testing

jobs:
  run-mirror:
    # ubuntu-latest (4 vCPU, 6h job cap): the conversion pass over ~2500
    # revisions is CPU-bound, and public repos get standard runners free.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config_file:
          - tcnopen-trdp.yml

    steps:

      - name: Checkout SVN mirroring configs repo # This repo
        uses: actions/checkout@v4
        with:
          path: mirror-configs
      # The checkout ref and the prepare action ref below must name the
      # same branch or version of the tool, so the code and its runner
      # preparation always match.
      - name: Checkout SVN replicator repo
        uses: actions/checkout@v4
        with:
          repository: HtoTheB/svn-replicator
          ref: main
          path: svn-replicator

      # System packages and uv come from the tool repository, so when the
      # tool gains new system requirements, only the action there changes.
      - name: Prepare the runner to run the tool
        uses: HtoTheB/svn-replicator/.github/actions/prepare@main

      # rsync is a dependency of the workflow, not of the tool (it serves
      # the rsync fast path), which is why it stays here.
      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Copy specific config to the replicator tool
        run: |
          cp \
            mirror-configs/configs/${{ matrix.config_file }} \
            svn-replicator/config.yml

      # If the config defines an rsyncURI (SourceForge read-only rsync access
      # to the raw repository), we sync the whole repo to the local disk and
      # point the replicator at it via a file:// URL. This is dramatically
      # faster than letting the replicator pull every revision over HTTP.
      # Without an rsyncURI, nothing changes: the remoteURI is used as-is.
      - name: Read rsyncURI from config
        id: svn_source
        working-directory: ./svn-replicator
        run: |
          # YAML-aware extraction (rsyncURI is an optional, workflow-only key)
          RSYNC_URI=$(uv run --no-project --with pyyaml python -c \
            "import yaml; print((yaml.safe_load(open('config.yml')).get('svn', {}) or {}).get('rsyncURI', '') or '')")
          echo "rsync_uri=${RSYNC_URI}" >> "$GITHUB_OUTPUT"
          echo "rsyncURI: ${RSYNC_URI:-<none>}"

      - name: Cache raw SVN repository
        if: steps.svn_source.outputs.rsync_uri != ''
        uses: actions/cache@v4
        with:
          # Save a fresh snapshot under a per-run key and restore the newest
          # one for this config. A fixed key would never advance: GitHub
          # cache entries are immutable, so saving to an existing key is
          # ignored. rsync --delete converges the copy to the remote state
          # either way, so a stale cache can never produce a wrong mirror.
          path: svn-repo
          key: svn-repo-${{ matrix.config_file }}-${{ github.run_id }}
          restore-keys: |
            svn-repo-${{ matrix.config_file }}-

      - name: Rsync raw SVN repository to local disk
        if: steps.svn_source.outputs.rsync_uri != ''
        working-directory: ./svn-replicator
        run: |
          REPO_DIR="$GITHUB_WORKSPACE/svn-repo"
          mkdir -p "$REPO_DIR"
          # The trailing slash syncs the *contents* of the module into
          # REPO_DIR; without it, rsync would nest everything under
          # REPO_DIR/<module name>/. --delete keeps the local copy an exact
          # replica; unchanged revisions are skipped (size + mtime
          # comparison), so a warm cache only transfers new revisions.
          rsync -a --delete "${{ steps.svn_source.outputs.rsync_uri }}/" "$REPO_DIR/"
          # Make sure the synced copy is a valid repository before use
          # (verify prints one line per revision - only show on failure)
          if ! svnadmin verify "$REPO_DIR" > /tmp/svnadmin-verify.log 2>&1; then
            cat /tmp/svnadmin-verify.log
            exit 1
          fi
          echo "svnadmin verify: OK"
          echo "Synced raw SVN repo to $REPO_DIR (youngest revision: r$(svnlook youngest "$REPO_DIR"))"

      - name: Point remoteURI at the local copy
        if: steps.svn_source.outputs.rsync_uri != ''
        working-directory: ./svn-replicator
        run: |
          # Uses PyYAML (pinned dep of the replicator) instead of yq, which
          # is not preinstalled on slim runners.
          uv run --no-project --with pyyaml python - <<EOF
          import yaml
          from pathlib import Path
          p = Path("config.yml")
          cfg = yaml.safe_load(p.read_text())
          cfg["svn"]["remoteURI"] = "file://" + str(Path("$GITHUB_WORKSPACE/svn-repo").resolve())
          p.write_text(yaml.safe_dump(cfg, sort_keys=False))
          print("remoteURI ->", cfg["svn"]["remoteURI"])
          EOF

      - name: Execute the SVN replicator tool 
        working-directory: ./svn-replicator
        run: |
          uv run ./src/main.py

      # Pushes always on schedule runs, and on manual runs when the box is
      # ticked. Skips itself if the config's git.remoteUrl is still empty.
      # Auth is a deploy key over SSH: the push is attributed to the key, not
      # to any user account, so it never lands in a person's activity feed.
      # (Commit-level attribution is separate and already handled: the
      # replicator sets each commit's author/committer to the original SVN
      # author, so mirror commits never hit the contribution graph either.)
      - name: Check push prerequisites
        if: github.event_name == 'schedule' || inputs.do_push == true
        env:
          MIRROR_PUSH_KEY: ${{ secrets.MIRROR_PUSH_KEY }}
        run: |
          if [ -z "$MIRROR_PUSH_KEY" ]; then
            echo "::error::Push is enabled, but the MIRROR_PUSH_KEY secret is missing or empty. Add the deploy key under this repo's Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "MIRROR_PUSH_KEY present"

      - name: Set up SSH agent with the deploy key
        if: github.event_name == 'schedule' || inputs.do_push == true
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.MIRROR_PUSH_KEY }}

      - name: Push to target repository
        if: github.event_name == 'schedule' || inputs.do_push == true
        working-directory: ./svn-replicator
        run: |
          # 1. Read the target repo directly from the YAML config
          # (owner/repo form, e.g. "HtoTheB/TCNOpen-Mirror")
          TARGET_REPO=$(uv run --no-project --with pyyaml python -c \
            "import yaml; print(yaml.safe_load(open('config.yml')).get('git', {}).get('remoteUrl', ''))")
          if [ -z "$TARGET_REPO" ]; then
            echo "::notice::git.remoteUrl is empty in config.yml - skipping push."
            exit 0
          fi
          # 2. Add the target remote over SSH (the deploy key handles auth)
          git -C .localWCs/git remote add target "git@github.com:${TARGET_REPO}.git"
          # 3. Perform the radical mirror push (force push, all branches, all tags)
          git -C .localWCs/git push target --mirror

      - name: Upload git repo as artifact
        uses: actions/upload-artifact@v4
        with:
          name: konvertiertes-git-repo
          path: ./svn-replicator/.localWCs/git
          include-hidden-files: true # Extrem wichtig, damit der unsichtbare .git Ordner mitkommt!
          retention-days: 1 # Löscht das ZIP nach einem Tag automatisch, um Speicherplatz zu sparen
